name: check

# Everything this repo asserts about itself, run through the flake so that CI and a
# laptop measure the same tree:
#
#   checks.typecheck        tsc --noEmit, with skipLibCheck OFF
#   checks.coverage         the coverage ratchet, against the PINNED frappe
#   checks.frappe-major     the package major is the frappe major
#   checks.verified-against package.json's frappe.verifiedAgainst matches the pin
#
# WHY NIX RATHER THAN `npm ci && npm run test`. Three of those four checks are claims
# about a frappe source tree, and until the flake existed CI had to go and find one:
# it cloned frappe at the branch named in package.json's `frappe.branch` and hoped.
# That is a moving target by construction — the branch advances — so the coverage
# ratchet failed on frappe's schedule rather than on this repo's changes, and a
# developer running the same command locally measured whatever checkout happened to
# sit at `../frappe` (which on a machine with a `develop` clone silently produced a
# phantom 3-path regression). `inputs.frappe` in flake.nix pins a revision, flake.lock
# records it, and dependabot moves it in a reviewable pull request.
#
# There is no `schedule:` here any more, and its absence is the point. It used to
# exist to notice frappe drifting under us; with the source pinned, nothing drifts
# except when the lock changes, and dependabot's weekly `nix` update is what proposes
# that — as a pull request that runs these checks, rather than as a red build on a
# Monday with no diff attached.

on:
  push:
    branches: ["version-*"]
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `determinate: false` — this flake carries no Determinate-only nixConfig
      # (FlakeHub substituters, lazy trees), so the default `true` buys nothing
      # here and just has `determinate-nixd` try to log into FlakeHub for a repo
      # that isn't registered there, logging a failure annotation on every run.
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      # Backs /nix/store with the GitHub Actions cache. cache.nixos.org already serves
      # the nixpkgs half of the closure; what it cannot serve is this repo's own npm
      # dependency derivations (importNpmLock turns package-lock.json into one
      # fixed-output derivation per tarball) or the unpacked frappe source, and those
      # are what this recovers between runs. Fork pull requests get a read-only token
      # and degrade to pull-only on their own, so no fork guard is needed.
      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          # Perf/diagnostic telemetry to Determinate Systems is on by default.
          diagnostic-endpoint: ""
          # This isn't a FlakeHub flake; without this the action logs its own
          # FlakeHub-login-failure annotation on top of determinate-nixd's.
          use-flakehub: false

      - name: nix flake check
        run: nix flake check -L

      # The artifact a release would publish, built from the same tree. Cheap, and it
      # is the only thing that answers "does `files` in package.json still ship the
      # right 16 files?" — a question no type check can reach.
      - name: nix build
        run: nix build .#default -L
